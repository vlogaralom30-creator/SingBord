name: Build Android APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Artifact APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Copy Environment Configuration
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Restore Debug Keystore from Base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "debug.keystore.base64 not found, proceeding without it."
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingBord-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
